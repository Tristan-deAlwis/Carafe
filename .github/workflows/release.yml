name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign, notarize, publish
    runs-on: macos-15

    # Job-level, because `if:` conditions can only read the `env` context when it
    # is declared here — a step's own `env:` is not visible to its own `if:`.
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install tools
        run: brew install xcodegen

      # ---------------------------------------------------------------------
      # Signing is entirely optional. Without the secrets the release still
      # builds and publishes, ad-hoc signed, and the notes say so plainly.
      #
      # To enable, add these repository secrets:
      #   MACOS_CERTIFICATE          base64 of a Developer ID Application .p12
      #   MACOS_CERTIFICATE_PASSWORD its export password
      #   MACOS_SIGNING_IDENTITY     "Developer ID Application: Name (TEAMID)"
      #   NOTARY_APPLE_ID            Apple ID email
      #   NOTARY_TEAM_ID             10-character team identifier
      #   NOTARY_PASSWORD            app-specific password
      # ---------------------------------------------------------------------
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/carafe-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # BSD base64 on macOS has no --decode long option; -d plus a redirect is portable.
          echo -n "$MACOS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Keep the login keychain in the search list so notarytool can still
          # read its own credentials.
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        if: env.NOTARY_APPLE_ID != ''
        env:
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          xcrun notarytool store-credentials carafe-ci \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build release artifact
        env:
          # Both are read by Scripts/release.sh, which no-ops the corresponding
          # step when its variable is empty.
          DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_APPLE_ID != '' && 'carafe-ci' || '' }}
        run: ./Scripts/release.sh | tee release.log

      - name: Collect release facts
        id: facts
        run: |
          ZIP="$(ls dist/Carafe-*.zip)"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Carafe.app/Contents/Info.plist)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          if xcrun stapler validate dist/Carafe.app >/dev/null 2>&1; then
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose release notes
        run: |
          {
            echo "## Carafe ${{ steps.facts.outputs.version }}"
            echo
            echo '```'
            echo 'brew tap tristan-dealwis/carafe'
            echo 'brew install --cask carafe'
            echo '```'
            echo
            echo "SHA-256: \`${{ steps.facts.outputs.sha256 }}\`"
            echo
            if [ "${{ steps.facts.outputs.notarized }}" != "true" ]; then
              echo "### ⚠️ This build is not notarized"
              echo
              echo "It is signed ad-hoc, so macOS Gatekeeper will refuse to open it and"
              echo "will claim the app is *damaged*. It is not. To run it anyway:"
              echo
              echo '```'
              echo 'xattr -d com.apple.quarantine /Applications/Carafe.app'
              echo '```'
              echo
              echo "Notifications are also unavailable in unsigned builds — macOS declines"
              echo "to register them. Carafe falls back to marking its menu bar icon when"
              echo "a reminder is due."
            fi
          } > notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: notes.md
          files: ${{ steps.facts.outputs.zip }}
          fail_on_unmatched_files: true
