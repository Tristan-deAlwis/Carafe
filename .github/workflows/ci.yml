name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    # macOS 15 image: Carafe targets macOS 14, and the runner must be at least
    # as new as the deployment target to run the unit tests.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -scheme Carafe \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

      - name: Test
        run: |
          xcodebuild test \
            -scheme Carafe \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY="-" \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult

      # Deliberately no "committed icons match a fresh render" check. ImageRenderer
      # output varies subtly between macOS builds, so byte-comparing PNGs would fail
      # for reasons unrelated to the artwork. IconGeneratorTests already runs above
      # and asserts every required size renders at the right dimensions, which is
      # the part that can actually break.
